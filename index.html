<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voxel Magazine | 4 States of Mind & Cosmos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Sarabun', sans-serif;
            overflow: hidden; width: 100vw; height: 100vh; touch-action: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* นิตยสาร HUD (Editorial Info) */
        .hud-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center; width: 90%; max-width: 800px;
            font-family: 'Prompt', sans-serif; text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            background: rgba(2, 6, 23, 0.4); padding: 15px 20px; border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2); backdrop-filter: blur(4px);
        }
        .hud-chapter { color: #94a3b8; font-size: 0.8rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        .hud-title { color: #fbbf24; font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; }
        .hud-sub { color: #38bdf8; font-size: 0.9rem; opacity: 0.9; margin-top: 6px; line-height: 1.5; }
        
        /* หน้าปัดวัดประสิทธิภาพ (Stress Test Monitor) */
        .fps-monitor {
            position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none;
            font-family: 'Courier New', Courier, monospace; background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px; border-radius: 8px; border-left: 3px solid #10b981;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-shadow: none;
        }
        .fps-val { color: #10b981; font-size: 1.5rem; font-weight: bold; }
        .fps-label { color: #94a3b8; font-size: 0.75rem; display: block; margin-top: 2px; }
        .cell-val { color: #fbbf24; font-size: 0.9rem; margin-top: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ระบบวัดประสิทธิภาพ (FPS & Cells) -->
    <div class="fps-monitor">
        <div class="fps-val" id="fps-display">60 FPS</div>
        <div class="fps-label">VOXEL OS CORE PERFORMANCE</div>
        <div class="cell-val" id="cell-display">Cells: 8,000 Active</div>
    </div>

    <!-- อินเทอร์เฟซนิตยสาร -->
    <div class="hud-overlay">
        <div class="hud-chapter" id="hud-chapter">บทนำ (Prologue)</div>
        <div class="hud-title" id="hud-title">วิญญาณแห่ง Voxel: สุญญตาและการก่อเกิด</div>
        <div class="hud-sub" id="hud-sub">คลิกที่ "ผลึกแก้ว" มุมซ้ายล่างเพื่อเปิดหน้าต่างแห่งจิตและกาลเวลาทั้ง 4 สภาวะ</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // โทนสีปรัชญาและอารมณ์
        const P = { voidBg: 0x020617, chaos: 0x475569, dharma: 0xfbbf24, eye: 0x0f172a, ether: 0x38bdf8, whiteDwarf: 0xffffff };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(P.voidBg);
        scene.fog = new THREE.FogExp2(P.voidBg, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 2.5, 100);
        light.position.set(0, 20, 20);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2.0));

        // ปริมาณ Voxel สำหรับ Stress Test
        const cellCount = 8000; 
        const voxelGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
        const voxelMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, metalness: 0.2, roughness: 0.1, transmission: 0.4, thickness: 0.5
        });
        
        const instancedVoxels = new THREE.InstancedMesh(voxelGeo, voxelMat, cellCount);
        scene.add(instancedVoxels);

        // ผลึกแก้วจุดกำเนิด (ปุ่ม Interactive)
        const originGeo = new THREE.OctahedronGeometry(2.0, 0);
        const originMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 0.8, wireframe: true });
        const originCrystal = new THREE.Mesh(originGeo, originMat);
        originCrystal.position.set(-12, -8, 5); // มุมซ้ายล่าง
        scene.add(originCrystal);

        const dummy = new THREE.Object3D();
        const cellData = [];
        let systemState = 0; // 0=Chaos, 1=Gathered, 2=Expanded, 3=Singularity

        // สร้างข้อมูลคณิตศาสตร์สำหรับ Voxel แต่ละชิ้น
        for (let i = 0; i < cellCount; i++) {
            // สภาวะที่ 0: ความโกลาหล (ฟุ้งซ่าน / Entropy)
            let cx = (Math.random() - 0.5) * 50;
            let cy = (Math.random() - 0.5) * 40;
            let cz = (Math.random() - 0.5) * 50;
            let chaosPos = new THREE.Vector3(cx, cy, cz);

            // สภาวะที่ 1 & 2: รวมตัวเป็นใบหน้ายิ้มทรงกลม
            let u = Math.random(), v = Math.random();
            let theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            let r = Math.cbrt(Math.random()) * 8; // รัศมีทรงกลม
            let sx = r * Math.sin(phi) * Math.cos(theta);
            let sy = r * Math.cos(phi);
            let sz = r * Math.sin(phi) * Math.sin(theta);
            let smilePos = new THREE.Vector3(sx, sy, sz);
            
            // คำนวณสีสำหรับหน้ายิ้ม
            let sColor = new THREE.Color(P.dharma);
            if (sz > 3.5) { // ด้านหน้า
                // ดวงตา
                if (sy > 1.5 && sy < 4 && Math.abs(sx) > 2.0 && Math.abs(sx) < 4.5) sColor.setHex(P.eye);
                // รอยยิ้ม
                if (sy < -1.0 && sy > -5.0 && Math.abs(sx) < 5.0) {
                    let curveY = -1.5 - Math.abs(sx) * 0.4;
                    if (Math.abs(sy - curveY) < 1.0) sColor.setHex(P.eye);
                }
            }
            
            cellData.push({ 
                current: chaosPos.clone(), 
                chaosPos: chaosPos,
                smilePos: smilePos,
                smileColor: sColor,
                target: new THREE.Vector3(),
                color: new THREE.Color(P.chaos),
                targetColor: new THREE.Color(P.chaos),
                speed: 0.02 + Math.random() * 0.04,
                phase: Math.random() * Math.PI * 2, // สำหรับสั่นสะเทือน
                index: i
            });
        }

        // ระบบวัด FPS
        let lastTimeFPS = performance.now();
        let frames = 0;
        const fpsDisplay = document.getElementById('fps-display');
        const fpsMonitor = document.querySelector('.fps-monitor');

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();
            
            // FPS Calculation
            frames++;
            let now = performance.now();
            if (now - lastTimeFPS >= 1000) {
                let currentFps = Math.round((frames * 1000) / (now - lastTimeFPS));
                fpsDisplay.innerText = currentFps + " FPS";
                // เปลี่ยนสี FPS ตามประสิทธิภาพ
                if (currentFps >= 50) fpsMonitor.style.borderLeftColor = "#10b981"; // เขียว
                else if (currentFps >= 30) fpsMonitor.style.borderLeftColor = "#fbbf24"; // เหลือง
                else fpsMonitor.style.borderLeftColor = "#ef4444"; // แดง
                
                frames = 0;
                lastTimeFPS = now;
            }

            originCrystal.rotation.x = time * 0.5;
            originCrystal.rotation.y = time * 0.7;

            // Voxel Core Loop (Stress Test Mathematics)
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];

                if (systemState === 0) {
                    // 1. ฟุ้งซ่าน (Chaos / Entropy)
                    d.target.copy(d.chaosPos);
                    d.target.y += Math.sin(time + d.phase) * 2.0; // ลอยสุ่มๆ
                    d.targetColor.setHex(P.chaos);
                    
                } else if (systemState === 1) {
                    // 2. ตั้งมั่น (Gathered Mind / Cohesion)
                    d.target.copy(d.smilePos);
                    // ส่ายหน้าน้อยๆ อย่างสงบ
                    let angle = Math.sin(time * 0.5) * 0.3;
                    let tx = d.smilePos.x * Math.cos(angle) - d.smilePos.z * Math.sin(angle);
                    let tz = d.smilePos.x * Math.sin(angle) + d.smilePos.z * Math.cos(angle);
                    d.target.set(tx, d.smilePos.y + Math.sin(time*2 + d.phase)*0.1, tz);
                    d.targetColor.copy(d.smileColor);
                    
                } else if (systemState === 2) {
                    // 3. ขยายตัว (Expanded Mind / Cosmic Expansion)
                    // ใช้ Sine Wave สร้างจังหวะพองตัวเหมือนลมหายใจ
                    let breathScale = 1.5 + Math.sin(time * 1.5) * 0.8; 
                    d.target.copy(d.smilePos).multiplyScalar(breathScale);
                    d.target.y += Math.sin(time * 0.8 + d.phase) * 0.5;
                    // ผสมสีทองกับฟ้าอีเธอเรียล (Lerp Color)
                    d.targetColor.copy(d.smileColor).lerp(new THREE.Color(P.ether), 0.6);
                    
                } else if (systemState === 3) {
                    // 4. แก่นแท้ (White Dwarf Singularity)
                    // ยุบรวมที่ศูนย์กลาง พร้อมสั่นสะเทือน (Jitter) ความถี่สูง
                    let jitter = 0.5;
                    d.target.set(
                        (Math.random() - 0.5) * jitter,
                        (Math.random() - 0.5) * jitter,
                        (Math.random() - 0.5) * jitter
                    );
                    d.targetColor.setHex(P.whiteDwarf);
                }

                // การเคลื่อนที่จริง (Lerp) สู่เป้าหมาย
                let moveSpeed = (systemState === 3) ? 0.15 : d.speed; // จังหวะดึงกลับ Singularity ต้องเร็วและรุนแรง
                d.current.lerp(d.target, moveSpeed);
                d.color.lerp(d.targetColor, 0.05);
                
                instancedVoxels.setColorAt(i, d.color);

                dummy.position.copy(d.current);
                // การหมุนของ Voxel (สั่นแรงมากใน State 3)
                if (systemState === 3) dummy.rotation.set(time*10 + d.phase, time*12, 0);
                else dummy.rotation.set(time * 0.2, time * 0.3, 0);
                
                dummy.updateMatrix();
                instancedVoxels.setMatrixAt(i, dummy.matrix);
            }
            
            instancedVoxels.instanceMatrix.needsUpdate = true;
            instancedVoxels.instanceColor.needsUpdate = true;
            
            // กล้องขยับเล็กรอบๆ
            camera.position.x = Math.sin(time * 0.1) * 25;
            camera.position.z = Math.cos(time * 0.1) * 25;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
        animate();

        // ระบบโต้ตอบ (Interaction) เปลี่ยนบทนิตยสาร
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(originCrystal);

            if (intersects.length > 0) {
                systemState = (systemState + 1) % 4; // วนลูป 0 -> 1 -> 2 -> 3 -> 0

                let speechText = "";
                if (systemState === 0) {
                    document.getElementById('hud-chapter').innerText = "บทที่ 1: ความโกลาหล (Entropy & The Wandering Mind)";
                    document.getElementById('hud-title').innerText = "ภาวะฟุ้งซ่าน: อนุภาคกระจัดกระจาย ไร้ระเบียบแบบบราวน์";
                    document.getElementById('hud-sub').innerText = "[คณิตศาสตร์] ตัวแปรสุ่ม // [วิทยาศาสตร์] ระบบปิดที่ไร้ระเบียบ // [ธรรมะ] จิตที่แกว่งไกวไร้แก่นสาร";
                    originCrystal.material.color.setHex(0x475569); originCrystal.material.emissive.setHex(0x475569);
                    speechText = "ฟุ้งซ่าน";
                } else if (systemState === 1) {
                    document.getElementById('hud-chapter').innerText = "บทที่ 2: การรวมตัว (Cohesion & The Gathered Mind)";
                    document.getElementById('hud-title').innerText = "ภาวะตั้งมั่น: แรงดึงดูดผสานอารมณ์ เกิดเป็น 'ปีติ'";
                    document.getElementById('hud-sub').innerText = "[คณิตศาสตร์] สมการทรงกลม // [วิทยาศาสตร์] แรงยึดเหนี่ยว // [ธรรมะ] อุปจารสมาธิ ความอิ่มเอมใจ";
                    originCrystal.material.color.setHex(P.dharma); originCrystal.material.emissive.setHex(P.dharma);
                    speechText = "ปีติ ตั้งมั่น";
                } else if (systemState === 2) {
                    document.getElementById('hud-chapter').innerText = "บทที่ 3: อนันตจักรวาล (Cosmic Expansion & Expanded Mind)";
                    document.getElementById('hud-title').innerText = "ภาวะขยายตัว: ไร้ขอบเขต เบาสบาย เคลื่อนไหวดั่งลมหายใจ";
                    document.getElementById('hud-sub').innerText = "[คณิตศาสตร์] เมทริกซ์ขยายตัว + คลื่นไซน์ // [วิทยาศาสตร์] เอกภพขยายตัว // [ธรรมะ] มหาคตจิต ไร้ขีดจำกัด";
                    originCrystal.material.color.setHex(P.ether); originCrystal.material.emissive.setHex(P.ether);
                    speechText = "มหาคตจิต ขยายตัว";
                } else if (systemState === 3) {
                    document.getElementById('hud-chapter').innerText = "บทที่ 4: ดาวแคระขาว (Singularity & The White Dwarf)";
                    document.getElementById('hud-title').innerText = "ภาวะเอกัคคตา: ยุบตัวสู่แก่นแท้ หนาแน่น บริสุทธิ์ ทรงพลังสูงสุด";
                    document.getElementById('hud-sub').innerText = "[คณิตศาสตร์] การบีบอัดพิกัดศูนย์กลาง // [วิทยาศาสตร์] แรงโน้มถ่วงวิกฤต // [ธรรมะ] เอกัคคตารมณ์ จิตเป็นหนึ่งเดียว";
                    originCrystal.material.color.setHex(0xffffff); originCrystal.material.emissive.setHex(0xffffff);
                    speechText = "เอกัคคตา แก่นแท้";
                }

                if ('speechSynthesis' in window) {
                    let ut = new SpeechSynthesisUtterance(speechText);
                    ut.lang = 'th-TH'; ut.pitch = 0.9;
                    window.speechSynthesis.speak(ut);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
